known_limitations:
  - Research 1 retains successful bags only when explicitly requested.
  - Existing bags contain no /research2/events topic.
  - Existing distribution shifts are not delayed Research 2 fault injections.
  - Existing summaries do not provide an exact simulation timestamp for every terminal event.
  - Research 1 lists /episode_state and /recovery_event for recording but does not publish them.
  - Research 1 does not provide rosbag recorder-loss event monitoring.
  - Research 2 protected-map work must wait for its own predictor and policy freeze.
