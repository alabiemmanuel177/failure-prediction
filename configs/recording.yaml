schema_version: 1
protocol_version: "1.0"
storage_id: mcap
clock: simulation_time
recording_policy: continuous_confirmatory
active_pilot_profile: compact_v2_after_attempt_97_semantic_image_storage_audit
recorder_loss_monitoring: independent_topic_health_reconciled_with_mcap_metadata
rosbag2_jazzy_cli_lost_message_statistics_available: false
record_services: false
record_hidden_topics: false

required_topics:
  - /clock
  - /cmd_vel
  - /odom
  - /amcl_pose
  - /scan
  - /tf
  - /tf_static
  - /diagnostics
  - /research2/events
  - /research2/raw/camera/image
  - /research2/raw/scan
  - /research2/raw/odom
  - /initialpose
  - /research2/raw/semantic/risk_grid
  - /research2/raw/semantic/risk_grid_odom

resolved_research1_topics:
  contact_sensor: /collision_event
  navigate_to_pose_action: /navigate_to_pose
  global_plan: /plan
  local_plan: /local_plan
  controller_trace: /behavior_tree_log
  global_costmap: /global_costmap/costmap
  local_costmap: /local_costmap/costmap
  perception_confidence: /semantic/confidence
  perception_uncertainty: /semantic/uncertainty
  perception_latency: /semantic/inference_latency_ms
  ground_truth_pose_label_only: /ground_truth_pose
  semantic_ground_truth_label_only: /camera/segmentation
  fault_and_episode_events_label_only: /research2/events
  localisation_reset_label_only: /initialpose
  semantic_risk_raw_label_only:
    - /research2/raw/semantic/risk_grid
    - /research2/raw/semantic/risk_grid_odom

research2_event_contract:
  topic: /research2/events
  message_type: diagnostic_msgs/msg/DiagnosticArray
  durability: transient_local
  reliability: reliable
  label_only: true
  required_event_types:
    - episode_started
    - no_injection_control
    - injection_planned
    - injection_started
    - injection_ended
    - injection_ineligible
    - terminal_event
    - recovery_started
    - recovery_finished

integrity:
  checksum: sha256
  raw_bags_immutable: true
  require_metadata_yaml: true
  require_message_counts: true
  flag_any_recorder_loss: true
  count_reconciliation_tolerance: "max(5 messages, 5 percent of larger count)"
  reject_mixed_clock_sources: true

storage_options:
  compression: Zstd
  compression_level: Fast
  no_message_index: false
  no_summary: false

profiles:
  full_v1:
    purpose: integrity_and_initial_storage_pilot
    retains_full_images: true
  compact_v1:
    purpose: balanced_pilot_after_storage_audit
    retains_full_images: false
    omitted_high_bandwidth_topics:
      - /research2/raw/camera/image
      - /camera/image
      - /camera/depth_image
      - /camera/segmentation
      - /imu
      - /particle_cloud
    preserved_evidence:
      - causal_scalar_feature_topics
      - raw_and_deployed_scan_and_odometry
      - ground_truth_pose_and_collision
      - research_events_and_diagnostics
      - plans_costmaps_tf_and_commands
      - semantic_class_confidence_uncertainty_latency_and_risk_grids
      - live_ground_truth_perception_metrics_in_label_only_summary
    deployable_feature_contract_changed: false
  compact_v2:
    purpose: balanced_pilot_after_semantic_image_storage_audit
    retains_full_images: false
    omitted_high_bandwidth_topics:
      - /research2/raw/camera/image
      - /camera/image
      - /camera/depth_image
      - /camera/segmentation
      - /semantic/classes
      - /semantic/confidence
      - /semantic/uncertainty
      - /semantic/inference_latency_ms
      - /imu
      - /particle_cloud
    scalar_replacement_topic: /research2/features/perception
    scalar_replacement_fields:
      - confidence_mean
      - uncertainty_mean
      - inference_latency_ms
      - temporal_disagreement
    preserved_evidence:
      - causal_scalar_feature_topics
      - raw_and_deployed_scan_and_odometry
      - ground_truth_pose_and_collision
      - research_events_and_diagnostics
      - plans_costmaps_tf_and_commands
      - semantic_risk_grids
      - live_ground_truth_perception_metrics_in_label_only_summary
    deployable_feature_contract_changed: false
