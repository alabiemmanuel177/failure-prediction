schema_version: 1
campaign_id: route_placement_smoke_v1
purpose: qualify deterministic path-relative environment-fault placement on a second development map
allowed_splits: [development]
execution_policy:
  exact_once_per_episode_key: true
  retain_all_bags: true
  refuse_while_research1_confirmatory_active: true
  stop_on_invalid: true
  concurrency: 1
controls: []
fault_matrix:
  episode_suffix: "401"
  severities: [medium]
  defaults:
    map: dev_01
    route: dev_01_r0
    clean_prefix_seconds: 10.0
    planned_onset_seconds: 15.0
    maximum_duration_seconds: 20.0
    maximum_wait_seconds: 10.0
    placement_mode: path_fraction
    route_fraction: 0.55
  families:
    dynamic_blockage: {system: s0, seed_base: 71500}
    planner_oscillation: {system: s0, seed_base: 71600}
audit_policy:
  engineering_only: true
  model_training_use: forbidden
  protected_test_used: false
