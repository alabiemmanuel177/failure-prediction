schema_version: 1
campaign_id: live_integrity_v2
purpose: replacement integrity campaign after the quarantined v1 clock and recorder repair
supersedes: live_integrity_v1
allowed_splits: [development]
minimum_valid_episodes_for_manual_audit: 20
execution_policy:
  exact_once_per_episode_key: true
  retain_all_bags: true
  refuse_while_research1_confirmatory_active: true
  stop_on_invalid: true
  concurrency: 1

controls:
  - {episode_key: control-s0-101, map: dev_00, route: dev_00_r0, system: s0, seed: 31001}
  - {episode_key: control-s0-102, map: dev_00, route: dev_00_r1, system: s0, seed: 31002}
  - {episode_key: control-s3-101, map: dev_00, route: dev_00_r0, system: s3, seed: 31003}
  - {episode_key: control-s3-102, map: dev_00, route: dev_00_r1, system: s3, seed: 31004}

fault_matrix:
  episode_suffix: "101"
  severities: [low, medium, high]
  defaults:
    map: dev_00
    route: dev_00_r0
    clean_prefix_seconds: 10.0
    planned_onset_seconds: 15.0
    maximum_duration_seconds: 20.0
    maximum_wait_seconds: 10.0
  families:
    camera_occlusion: {system: s3, seed_base: 31100}
    lidar_dropout: {system: s0, seed_base: 31200}
    wheel_slip: {system: s0, seed_base: 31300}
    localisation_perturbation: {system: s0, seed_base: 31400}
    dynamic_blockage:
      system: s0
      seed_base: 31500
      injection_x: -0.5
      injection_y: -0.5
      injection_yaw: 0.0
      placement_status: candidate_corridor_midpoint_requires_live_witness
    planner_oscillation:
      system: s0
      seed_base: 31600
      injection_x: -0.5
      injection_y: -0.5
      injection_yaw: 0.0
      placement_status: candidate_corridor_midpoint_requires_live_witness
    semantic_corruption: {system: s3, seed_base: 31700}

audit_sampling:
  primary_episode_keys:
    - control-s0-101
    - control-s0-102
    - control-s3-101
    - control-s3-102
    - camera_occlusion-low-101
    - camera_occlusion-medium-101
    - camera_occlusion-high-101
    - lidar_dropout-low-101
    - lidar_dropout-medium-101
    - lidar_dropout-high-101
    - wheel_slip-low-101
    - wheel_slip-medium-101
    - localisation_perturbation-low-101
    - localisation_perturbation-medium-101
    - dynamic_blockage-low-101
    - dynamic_blockage-medium-101
    - planner_oscillation-low-101
    - planner_oscillation-medium-101
    - semantic_corruption-low-101
    - semantic_corruption-medium-101
  infrastructure_invalid_reserve_keys:
    - wheel_slip-high-101
    - localisation_perturbation-high-101
    - dynamic_blockage-high-101
    - planner_oscillation-high-101
    - semantic_corruption-high-101
  replacement_rule: reserve_order_only_for_prespecified_infrastructure_invalid_primary_attempts
  select_before_reviewing_terminal_outcomes: true
  second_reviewer_required: true

admission_evidence:
  repaired_clean_smoke_run_id: 4b89eb09-ab29-4693-a609-746c91a370a2
  repaired_clean_smoke_artifact_validation: passed
  protected_test_used: false
