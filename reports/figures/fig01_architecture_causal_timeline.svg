<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="1000" height="420" fill="white"/><text x="60" y="30" font-family="sans-serif" font-size="18" font-weight="600">Architecture and causal labelling timeline</text><rect x="60.0" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="117.9" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">telemetry</text><line x1="175.71428571428572" y1="85" x2="185.71428571428572" y2="85" stroke="#2455a4" stroke-width="2"/><rect x="185.71428571428572" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="243.6" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">causal features</text><text x="243.6" y="96" text-anchor="middle" font-family="sans-serif" font-size="11">(value/age/missing)</text><line x1="301.42857142857144" y1="85" x2="311.42857142857144" y2="85" stroke="#2455a4" stroke-width="2"/><rect x="311.42857142857144" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="369.3" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">predictor P3</text><line x1="427.14285714285717" y1="85" x2="437.14285714285717" y2="85" stroke="#2455a4" stroke-width="2"/><rect x="437.1428571428571" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="495.0" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">calibration</text><line x1="552.8571428571428" y1="85" x2="562.8571428571428" y2="85" stroke="#2455a4" stroke-width="2"/><rect x="562.8571428571429" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="620.7" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">alarm policy</text><text x="620.7" y="96" text-anchor="middle" font-family="sans-serif" font-size="11">(2-of-3, 10 s cooldown)</text><line x1="678.5714285714286" y1="85" x2="688.5714285714286" y2="85" stroke="#2455a4" stroke-width="2"/><rect x="688.5714285714286" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="746.4" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">independent guard</text><line x1="804.2857142857142" y1="85" x2="814.2857142857142" y2="85" stroke="#2455a4" stroke-width="2"/><rect x="814.2857142857142" y="55" width="115.71428571428571" height="60" rx="6" fill="#eef3fb" stroke="#2455a4"/><text x="872.1" y="80" text-anchor="middle" font-family="sans-serif" font-size="11">recovery action</text><line x1="60" y1="260" x2="940" y2="260" stroke="#222" stroke-width="2"/><rect x="60.0" y="200" width="231.6" height="50" fill="#2455a4" opacity="0.25"/><text x="175.8" y="190" text-anchor="middle" font-family="sans-serif" font-size="12">past-only history 5 s</text><line x1="291.6" y1="195" x2="291.6" y2="290" stroke="#222" stroke-dasharray="4 3"/><text x="291.6" y="308" text-anchor="middle" font-family="sans-serif" font-size="12">decision time t</text><rect x="384.2" y="265" width="416.8" height="22" fill="#3a9d5d" opacity="0.35"/><text x="615.8" y="280" text-anchor="middle" font-family="sans-serif" font-size="11">positive: t in [t_f - 10 s, t_f - 1 s]</text><rect x="801.1" y="265" width="46.3" height="22" fill="#b3261e" opacity="0.45"/><line x1="847.4" y1="220" x2="847.4" y2="290" stroke="#b3261e" stroke-width="3"/><text x="847.4" y="212" text-anchor="middle" font-family="sans-serif" font-size="12">first terminal event t_f</text><text x="847.4" y="308" text-anchor="middle" font-family="sans-serif" font-size="11">too-late guard 1 s</text><text x="60" y="350" font-family="sans-serif" font-size="12">Eligible negatives lie at least 20 s from every event and injection onset. Guard: rear clearance ≥ 0.35 m, rotation clearance ≥ 0.4 m, at most 2 repeated recoveries.</text></svg>
