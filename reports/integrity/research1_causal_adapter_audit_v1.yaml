time_base: simulation_time_via_receive_clock_map
episode_start_definition: first /behavior_tree_log message (Nav2 bt_navigator ticks
  only after the NavigateToPose goal is accepted); receive time mapped to simulation
  seconds. Research 1 stamps sim_t0 immediately before send_goal, so the true dispatch
  precedes this by the acceptance latency (start_lag recorded per episode).
event_time_derivation:
  collision:
    method: exact_first_collision_event_message
    detail: first /collision_event message carrying at least one contact; Research
      1 republishes only disqualifying full-body contacts on this topic. Cross-checked
      against episode_start + aggregate duration_s (residual recorded).
    exactness: exact
  navigation_abort:
    method: bounded_episode_start_plus_aggregate_duration
    detail: 'Research 1 does not log the root NavigateToPose ABORTED transition; the
      event time is episode_start + duration_s where duration_s is the Research 1
      simulated-seconds duration from goal dispatch to the aborted action result.
      Upper bound: overestimates by the dispatch-to-first-tick lag plus the 0.1 s
      controller poll interval.'
    exactness: bounded_upper
  mission_timeout:
    method: route_budget_boundary_via_aggregate_duration
    detail: episode_start + duration_s, required to lie within tolerance of the frozen
      route episode_timeout_s (simulated seconds). Wall-clock backstop timeouts that
      fire before the simulated budget are rejected.
    exactness: bounded_upper
  false_arrival:
    method: bounded_episode_start_plus_aggregate_duration
    detail: episode_start + duration_s at the Nav2 SUCCEEDED result, with label-only
      ground-truth goal distance required to exceed the frozen goal tolerance.
    exactness: bounded_upper
  none:
    method: episode_end_at_episode_start_plus_aggregate_duration
    detail: success has no event; the episode ends at the SUCCEEDED result.
    exactness: bounded_upper
